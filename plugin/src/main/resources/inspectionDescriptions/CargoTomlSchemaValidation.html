Reports values in <code>Cargo.toml</code> that do not match the Cargo manifest format: an unknown
top-level table, a misspelled key such as <code>[dependancies]</code>, a value of the wrong type
such as <code>optional = "yes"</code>, or a value Cargo does not accept such as
<code>edition = "2077"</code>.
